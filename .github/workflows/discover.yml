name: Discover Sales pages
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-bot.txt
      - run: python discover.py
        env:
          SALES_LOGIN: ${{ secrets.SALES_LOGIN }}
          SALES_PASSWORD: ${{ secrets.SALES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          ROSTER_KEY: ${{ secrets.ROSTER_KEY }}
      - name: encrypt photos for Claude
        run: |
          [ -d /tmp/ph ] || exit 0
          tar czf /tmp/p.tgz -C /tmp ph; openssl rand -out /tmp/k.bin 32; mkdir -p drop
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/p.tgz -out drop/photos.tgz.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey drop_pub.pem -in /tmp/k.bin -out drop/photos_key.enc
          rm /tmp/k.bin /tmp/p.tgz
      - run: |
          git config user.name "merch-bot"; git config user.email "bot@users.noreply.github.com"
          git add drop && git diff --cached --quiet && exit 0
          git commit -qm "store fix"
          for i in 1 2 3; do git pull --rebase -X ours -q && git push -q && break; sleep 7; done
