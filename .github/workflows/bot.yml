name: Bot (Telegram xabariga javob)
on:
  workflow_dispatch:
    inputs:
      update: {description: "Cloudflare Worker yuboradigan qisqa Telegram update (JSON)", required: true}
permissions:
  contents: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install requests pandas openpyxl pillow cryptography beautifulsoup4 lxml scipy
      - run: python bot.py
        env:
          UPDATE: ${{ inputs.update }}
          SALES_LOGIN: ${{ secrets.SALES_LOGIN }}
          SALES_PASSWORD: ${{ secrets.SALES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      - name: Save (encrypted)
        if: always()
        run: |
          git config user.name "merch-bot"; git config user.email "bot@users.noreply.github.com"
          git add drop/store 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "bot store"
          for i in 1 2 3 4; do git pull --rebase -X ours -q && git push -q && break; sleep 7; done
