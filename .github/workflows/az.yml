name: Аудиозаписи (qo'lda)
on:
  schedule:
    - cron: '10 8 * * *'      # 13:10 Toshkent (Worker ham shu vaqtda ishga tushiradi; takror bo'lsa 'nothing new')
  workflow_dispatch:
    inputs:
      from: {description: "YYYY-MM-DD", default: ""}
      to: {description: "YYYY-MM-DD", default: ""}
      mode: {description: "bo'sh / split / review / relisten / recheck", default: ""}
      model: {description: "Gemini model (bo'sh = avtomatik)", default: ""}
      group: {description: "tp / mp / tp,mp (bo'sh = ikkalasi)", default: ""}
      redo: {description: "1 = shu kunlar blokini o'chirib qaytadan tuzish", default: ""}
      region: {description: "faqat shu hudud (masalan Андижан), bo'sh = hammasi", default: ""}
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-bot.txt
      - run: python az.py
        env:
          AZ_MODE: ${{ inputs.mode }}
          GEMINI_MODEL: ${{ inputs.model }}
          AZ_FROM: ${{ inputs.from }}
          AZ_TO: ${{ inputs.to }}
          AZ_GROUP: ${{ inputs.group }}
          AZ_REGION: ${{ inputs.region }}
          AZ_REDO: ${{ inputs.redo }}
          SALES_LOGIN: ${{ secrets.SALES_LOGIN }}
          SALES_PASSWORD: ${{ secrets.SALES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ROSTER_KEY: ${{ secrets.ROSTER_KEY }}
      - if: always()
        run: |
          git config user.name "merch-bot"; git config user.email "bot@users.noreply.github.com"
          git add drop 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "az store"
          for i in 1 2 3; do git pull --rebase -X ours -q && git push -q && break; sleep 7; done
