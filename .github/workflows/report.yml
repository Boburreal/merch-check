name: Hisobot (Telegram)
on:
  schedule:
    - cron: "30 12 * * *"    # 17:30 Tashkent - kunlik
    - cron: "30 3 * * *"     # 08:30 Tashkent - kechagi kun yangilangan
    - cron: "0 5 * * 1"      # Dushanba 10:00 - haftalik
    - cron: "15 5 1 * *"     # Har oy 1-sanasi 10:15 - oylik
  workflow_dispatch:
    inputs:
      mode: {description: "daily / update / weekly / monthly / range", default: "daily"}
      from: {description: "range uchun YYYY-MM-DD", default: ""}
      to: {description: "range uchun YYYY-MM-DD", default: ""}
permissions:
  contents: write
concurrency:
  group: report-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas openpyxl pillow cryptography
      - name: Mode
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "30 12 * * *") echo "mode=daily" >> $GITHUB_OUTPUT;;
            "30 3 * * *")  echo "mode=update" >> $GITHUB_OUTPUT;;
            "0 5 * * 1")   echo "mode=weekly" >> $GITHUB_OUTPUT;;
            "15 5 1 * *")  echo "mode=monthly" >> $GITHUB_OUTPUT;;
            *)             echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;;
          esac
      - run: python report.py
        env:
          MODE: ${{ steps.m.outputs.mode }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          SALES_LOGIN: ${{ secrets.SALES_LOGIN }}
          SALES_PASSWORD: ${{ secrets.SALES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      - name: Save merch results (encrypted)
        if: always()
        run: |
          git config user.name "merch-bot"; git config user.email "bot@users.noreply.github.com"
          git add drop/store 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "merch store ${{ steps.m.outputs.mode }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
