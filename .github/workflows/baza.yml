name: Baza bot (filial zayavkalari)
on:
  workflow_dispatch:
    inputs:
      update: {description: "Cloudflare Worker yuboradigan qisqa Telegram update (JSON)", required: true}
permissions:
  contents: write
jobs:
  baza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        id: venv
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ env.pythonLocation }}-${{ hashFiles('requirements-bot.txt') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: pip install -r requirements-bot.txt
      - run: python baza.py
        env:
          UPDATE: ${{ inputs.update }}
          BAZA_LIVE: ${{ vars.BAZA_LIVE }}
          SALES_LOGIN: ${{ secrets.SALES_LOGIN }}
          SALES_PASSWORD: ${{ secrets.SALES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAZA_BOT_TOKEN: ${{ secrets.BAZA_BOT_TOKEN }}
          ROSTER_KEY: ${{ secrets.ROSTER_KEY }}
      - name: Save (encrypted)
        if: always()
        run: |
          git config user.name "merch-bot"; git config user.email "bot@users.noreply.github.com"
          git add drop/store 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "baza store"
          for i in 1 2 3 4; do git pull --rebase -X ours -q && git push -q && break; sleep 7; done
