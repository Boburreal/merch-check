name: Roster plan change
on:
  workflow_dispatch:
    inputs:
      name: {description: "ТП: Фамилия Имя (e.g. Мамедова Дильноза)", required: true}
      plan: {description: "daily plan, e.g. 10", required: true}
permissions:
  contents: write
concurrency:
  group: roster-plan
  cancel-in-progress: false
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas cryptography
      - run: python roster_plan.py "${{ inputs.name }}" "${{ inputs.plan }}"
        env:
          ROSTER_KEY: ${{ secrets.ROSTER_KEY }}
      - run: |
          git config user.name "merch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/roster.enc && git diff --cached --quiet && exit 0
          git commit -qm "roster: plan change"
          for i in 1 2 3; do git pull --rebase -X ours -q && git push -q && break; sleep 7; done
