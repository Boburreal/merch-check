name: Roster update (ТП -> МП, yangi МП)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roster-plan
  cancel-in-progress: false
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas cryptography
      - run: python roster_update.py
        env:
          ROSTER_KEY: ${{ secrets.ROSTER_KEY }}
          ROSTER_UPDATE: ${{ secrets.ROSTER_UPDATE }}
      - run: |
          git config user.name "merch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/roster.enc && git diff --cached --quiet && exit 0
          git commit -qm "roster: ТП -> МП, new МП"
          for i in 1 2 3; do git pull --rebase -X ours -q && git push -q && break; sleep 7; done
